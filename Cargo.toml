["package"]
"name" = "spitzli-archives"
"version" = "0.3.0"
"edition" = "2024"
"rust-version" = "1.94"
"license" = "AGPL-3.0-only"
"publish" = false

["workspace"]

["dependencies"]
"serde_json" = "1"
"ed25519-dalek" = "2"
"hex" = "0.4"
"url" = "2"
"flate2" = "1"
"sha2" = "0.10"
"async-trait" = "0.1"
"tempfile" = "3"

["dependencies"."spitzli-export-protocol"]
"git" = "https://github.com/spitzli/cloud-plugin-sdk"
"rev" = "8019f3df67dba3fed3083f22635e4725028c1b5e"
"package" = "spitzli-export-protocol"

["dependencies"."serde"]
"version" = "1"
"features" = ["derive"]

["dependencies"."tokio"]
"version" = "1"
"features" = ["macros", "rt-multi-thread", "signal", "time", "process", "io-util", "fs"]

["dependencies"."spitzli-plugin-protocol"]
"git" = "https://github.com/spitzli/cloud-plugin-sdk"
"rev" = "8019f3df67dba3fed3083f22635e4725028c1b5e"
"package" = "spitzli-plugin-protocol"

["dependencies"."spitzli-plugin-runtime"]
"git" = "https://github.com/spitzli/cloud-plugin-sdk"
"rev" = "8019f3df67dba3fed3083f22635e4725028c1b5e"
"package" = "spitzli-plugin-runtime"

["dependencies"."spitzli-plugin-kit"]
"git" = "https://github.com/spitzli/cloud-plugin-sdk"
"rev" = "8019f3df67dba3fed3083f22635e4725028c1b5e"
"package" = "spitzli-plugin-kit"

["dependencies"."tonic"]
"version" = "0.14.6"
"features" = ["transport"]

["dependencies"."uuid"]
"version" = "1"
"features" = ["v4"]

["dependencies"."tokio-postgres"]
"version" = "0.7"
"features" = ["with-uuid-1"]

["dependencies"."spitzli-object-storage"]
"git" = "https://github.com/spitzli/cloud-plugin-sdk"
"rev" = "8019f3df67dba3fed3083f22635e4725028c1b5e"
"package" = "spitzli-object-storage"

["dependencies"."aws-sdk-s3"]
"version" = "=1.137.0"
"default-features" = false
"features" = ["rt-tokio", "rustls", "default-https-client"]

["dependencies"."rustix"]
"version" = "1"
"features" = ["process"]

["dependencies"."rustls"]
"version" = "0.23"
"default-features" = false
"features" = ["ring", "std", "tls12"]

["features"]
"local-native-fixture" = []
"local-test" = ["spitzli-object-storage/local-test"]

["dev-dependencies"]
"chrono" = "0.4"
"rcgen" = "0.14"
"futures-util" = "0.3"

["dev-dependencies"."spitzli-repository-protocol"]
"git" = "https://github.com/spitzli/cloud-plugin-sdk"
"rev" = "8019f3df67dba3fed3083f22635e4725028c1b5e"
"package" = "spitzli-repository-protocol"

["dev-dependencies"."tokio-stream"]
"version" = "0.1"
"features" = ["net"]

["dev-dependencies"."sea-orm"]
"version" = "=2.0.4"
"default-features" = false
"features" = ["macros", "sqlx-postgres", "runtime-tokio-rustls", "with-json", "with-chrono"]

["dev-dependencies"."spitzli-plugin-http"]
"git" = "https://github.com/spitzli/cloud-plugin-sdk"
"rev" = "8019f3df67dba3fed3083f22635e4725028c1b5e"
"package" = "spitzli-plugin-http"

["lints"]

["lints"."rust"]
"unsafe_op_in_unsafe_fn" = "deny"
"unused_must_use" = "deny"
"unfulfilled_lint_expectations" = "deny"

["lints"."clippy"]
"allow_attributes_without_reason" = "deny"
"as_ptr_cast_mut" = "deny"
"await_holding_lock" = "deny"
"await_holding_refcell_ref" = "deny"
"cast_lossless" = "deny"
"checked_conversions" = "deny"
"dbg_macro" = "deny"
"excessive_nesting" = "deny"
"exit" = "deny"
"fallible_impl_from" = "deny"
"implicit_clone" = "deny"
"let_underscore_future" = "deny"
"lossy_float_literal" = "deny"
"manual_assert" = "deny"
"manual_let_else" = "deny"
"match_wildcard_for_single_variants" = "deny"
"mem_forget" = "deny"
"mut_mut" = "deny"
"needless_continue" = "deny"
"needless_pass_by_ref_mut" = "deny"
"option_option" = "deny"
"rc_mutex" = "deny"
"redundant_else" = "deny"
"ref_option_ref" = "deny"
"todo" = "deny"
"unchecked_time_subtraction" = "deny"
"undocumented_unsafe_blocks" = "deny"
"unimplemented" = "deny"
"unnecessary_box_returns" = "deny"
"unnecessary_safety_comment" = "deny"
"unnecessary_safety_doc" = "deny"
"unnested_or_patterns" = "deny"

["lints"."clippy"."correctness"]
"level" = "deny"
"priority" = -1

["lints"."clippy"."suspicious"]
"level" = "deny"
"priority" = -1

["lints"."clippy"."complexity"]
"level" = "deny"
"priority" = -1

["lints"."clippy"."perf"]
"level" = "deny"
"priority" = -1

["lints"."clippy"."style"]
"level" = "deny"
"priority" = -1

["profile"]

["profile"."dev"]
"debug" = 0
